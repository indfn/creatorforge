[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creatorforge"
version = "0.1.0"
description = "AI-powered content creation suite"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "requests>=2.25.0",
    "yt-dlp>=2023.0.0",
    "reportlab>=4.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.20.0",
    "portalocker>=2.8.2",
    "cryptography>=41.0.0",
]

[tool.setuptools.packages.find]
include = ["agent_core*", "production*", "scripts*"]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
creatorforge-recon = "agent_core.recon.web.app:main"
creatorforge-tts = "production.AudioGeneration.tts_generation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit external APIs",
    "online: marks tests needing network access",
]

[tool.coverage.run]
source = ["agent_core"]
omit = [
    "*.venv/*",
    "*/tests/*",
    "*/production/*",
    "*/scripts/*",
    "*/setup.py",
]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
